name: Build VTosters Lite

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '**.md'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
              
      - name: Download tools
        run: |
          sudo apt update
          sudo apt install default-jre
          sudo apt install python3
          sudo apt install zipalign
          chmod +x scripts/apktool.jar
          chmod +x scripts/apksigner.jar
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android 
          
      - name: Build VTLite
        run: |
          chmod +x gradlew scripts/build.sh
          ./gradlew generateBuildTasks
          ./gradlew prepareDexForMergeDev
          ./scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify the apk
        run: |
          java -jar scripts/apksigner.jar verify build-output/VTLite.apk
                      
      - name: Upload apk to artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTLite.apk
          path: |
            build-output/VTLite.apk
            build-output/RELEASE_NOTES.md
